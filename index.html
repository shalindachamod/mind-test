<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Test Game - Extra Difficulty Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* --- THEME SYSTEM --- */
        [data-theme="classic"][data-mode="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.12);
            --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --btn-bg: rgba(255, 255, 255, 0.06);
            --btn-border: rgba(255, 255, 255, 0.18);
            --action-btn: #38bdf8;
            --level-card-accent: #38bdf8;
            --classic-card-accent: #f43f5e;
            --border-glow: transparent;
        }
        [data-theme="classic"][data-mode="light"] {
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 50%, #cbd5e1 100%);
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(148, 163, 184, 0.35);
            --card-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-sub: #475569;
            --btn-bg: rgba(241, 245, 249, 0.9);
            --btn-border: rgba(148, 163, 184, 0.5);
            --action-btn: #0284c7;
            --level-card-accent: #0284c7;
            --classic-card-accent: #e11d48;
            --border-glow: none;
        }

        [data-theme="neon"][data-mode="dark"] {
            --bg-gradient: linear-gradient(135deg, #09090e 0%, #1a0033 50%, #2b0040 100%);
            --card-bg: rgba(20, 10, 35, 0.85);
            --card-border: rgba(255, 0, 255, 0.3);
            --card-shadow: 0 0 35px rgba(255, 0, 255, 0.25);
            --text-main: #00ffff;
            --text-sub: #f472b6;
            --btn-bg: rgba(0, 255, 255, 0.05);
            --btn-border: #ff00ff;
            --action-btn: #d946ef;
            --level-card-accent: #00ffff;
            --classic-card-accent: #ff00ff;
            --border-glow: 0 0 12px rgba(255, 0, 255, 0.4);
        }
        [data-theme="neon"][data-mode="light"] {
            --bg-gradient: linear-gradient(135deg, #fef2f2 0%, #faf5ff 50%, #f0fdf4 100%);
            --card-bg: rgba(255, 255, 255, 0.92);
            --card-border: #c084fc;
            --card-shadow: 0 10px 30px rgba(192, 132, 252, 0.2);
            --text-main: #581c87;
            --text-sub: #a855f7;
            --btn-bg: rgba(250, 245, 255, 0.9);
            --btn-border: #d8b4fe;
            --action-btn: #9333ea;
            --level-card-accent: #0891b2;
            --classic-card-accent: #db2777;
            --border-glow: 0 0 10px rgba(192, 132, 252, 0.3);
        }

        [data-theme="cyberpunk"][data-mode="dark"] {
            --bg-gradient: linear-gradient(135deg, #0d0221 0%, #000000 50%, #1a0c00 100%);
            --card-bg: rgba(18, 18, 20, 0.92);
            --card-border: rgba(255, 230, 0, 0.4);
            --card-shadow: 0 0 30px rgba(255, 230, 0, 0.2);
            --text-main: #ffe600;
            --text-sub: #00f0ff;
            --btn-bg: rgba(255, 230, 0, 0.08);
            --btn-border: #ffe600;
            --action-btn: #00f0ff;
            --level-card-accent: #ffe600;
            --classic-card-accent: #00f0ff;
            --border-glow: 0 0 12px rgba(255, 230, 0, 0.4);
        }
        [data-theme="cyberpunk"][data-mode="light"] {
            --bg-gradient: linear-gradient(135deg, #fffbeb 0%, #fef3c7 50%, #fde68a 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: #d97706;
            --card-shadow: 0 10px 30px rgba(217, 119, 6, 0.15);
            --text-main: #78350f;
            --text-sub: #0284c7;
            --btn-bg: rgba(254, 243, 199, 0.8);
            --btn-border: #f59e0b;
            --action-btn: #0284c7;
            --level-card-accent: #d97706;
            --classic-card-accent: #0284c7;
            --border-glow: 0 0 8px rgba(245, 158, 11, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Header Bar */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 460px;
            margin-bottom: 20px;
        }

        h2 {
            color: var(--text-main);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-select {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 8px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(10px);
            box-shadow: var(--border-glow);
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: var(--border-glow);
        }

        .icon-btn:hover {
            transform: scale(1.08);
        }

        .game-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 30px;
            max-width: 460px;
            width: 100%;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(12px);
            text-align: center;
            position: relative;
        }

        /* Home Screen */
        .home-brand {
            margin-bottom: 20px;
        }

        .home-brand .brain-icon {
            font-size: 3.5rem;
            display: inline-block;
            animation: pulse 2s infinite ease-in-out;
            margin-bottom: 5px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px var(--text-main)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 12px var(--text-main)); }
        }

        .home-brand h1 {
            color: var(--text-main);
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .home-brand p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .difficulty-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .diff-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-sub);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .diff-btn.active {
            background: var(--action-btn);
            color: #fff;
            border-color: var(--action-btn);
        }

        [data-theme="cyberpunk"][data-mode="dark"] .diff-btn.active {
            color: #000;
        }

        .mode-cards {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .mode-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .mode-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: transparent;
            transition: background 0.3s;
        }

        .mode-card.level-mode::before { background: var(--level-card-accent); }
        .mode-card.classic-mode::before { background: var(--classic-card-accent); }

        .mode-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .mode-icon {
            font-size: 2rem;
            background: rgba(0, 0, 0, 0.05);
            padding: 10px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mode-info h3 {
            color: var(--text-main);
            font-size: 1.05rem;
            margin-bottom: 4px;
        }

        .mode-info p {
            color: var(--text-sub);
            font-size: 0.8rem;
            line-height: 1.3;
        }

        /* Color Buttons Layouts */
        .color-buttons {
            display: grid;
            gap: 12px;
            margin-bottom: 25px;
        }

        /* 4 Color Mode Layout */
        .color-buttons.mode-4 {
            grid-template-columns: repeat(2, 1fr);
        }

        /* 6 Color Hexagon Layout */
        .color-buttons.mode-6 {
            grid-template-columns: repeat(3, 1fr);
        }

        .color-btn {
            background: var(--btn-bg);
            border: 2px solid var(--btn-border);
            color: var(--text-main);
            font-weight: bold;
            padding: 22px 10px;
            cursor: pointer;
            border-radius: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            opacity: 0.8;
            box-shadow: var(--border-glow);
        }

        .color-btn:not(:disabled) {
            opacity: 1;
        }

        .color-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .color-btn.active {
            opacity: 1 !important;
            background: #ffd700 !important;
            color: #000 !important;
            border-color: #ffd700 !important;
            box-shadow: 0 0 25px rgba(255, 215, 0, 1);
            transform: scale(1.05);
        }

        .color-btn.wrong {
            background: #ff4757 !important;
            border-color: #ff4757 !important;
            color: #fff !important;
            animation: shake 0.5s ease-in-out;
            opacity: 1;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .level-display {
            color: var(--text-main);
            font-weight: bold;
        }

        .score-hint {
            color: var(--text-sub);
            font-style: italic;
            font-size: 0.85rem;
        }

        #sequence-display {
            margin-bottom: 15px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #sequence-display p {
            font-size: 1rem;
            color: var(--text-sub);
        }

        #result-message {
            color: var(--text-main);
            font-weight: bold;
            text-align: center;
            min-height: 24px;
            margin-bottom: 15px;
        }

        .control-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .action-btn {
            background: var(--action-btn);
            border: none;
            color: white;
            padding: 12px 22px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        [data-theme="cyberpunk"][data-mode="dark"] .action-btn {
            color: #000;
        }

        .action-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) {
            .color-btn {
                padding: 18px 5px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body data-theme="classic" data-mode="dark">

    <div class="header-bar">
        <h2>🧠 Mind Test</h2>
        <div class="controls-group">
            <select class="theme-select" id="themeSelect" onchange="changeTheme(this.value)">
                <option value="classic">🎨 Classic</option>
                <option value="neon">⚡ Neon Glow</option>
                <option value="cyberpunk">🤖 Cyberpunk</option>
            </select>
            <button class="icon-btn" id="soundToggleBtn" onclick="toggleAudioMute()" title="Mute / Unmute Sound">🔊</button>
            <button class="icon-btn" id="modeToggleBtn" onclick="toggleDarkLightMode()" title="Toggle Dark / Light">🌙</button>
        </div>
    </div>
    
    <div class="game-container">
        
        <!-- Home Screen -->
        <div id="mode-screen">
            <div class="home-brand">
                <div class="brain-icon">🧠</div>
                <h1>MEMORY MASTER</h1>
                <p>Select difficulty & test your memory</p>
            </div>

            <!-- Difficulty Selector -->
            <div class="difficulty-selector">
                <button class="diff-btn active" id="diff-easy" onclick="setDifficulty('easy')">🟢 Easy (4 Colors)</button>
                <button class="diff-btn" id="diff-hard" onclick="setDifficulty('hard')">🔥 Hard (6 Colors)</button>
            </div>

            <div class="mode-cards">
                <div class="mode-card level-mode" onclick="startGame('level')">
                    <div class="mode-icon">🏆</div>
                    <div class="mode-info">
                        <h3>Level Challenge</h3>
                        <p>Complete 25 challenging levels with increasing pattern lengths.</p>
                    </div>
                </div>

                <div class="mode-card classic-mode" onclick="startGame('classic')">
                    <div class="mode-icon">♾️</div>
                    <div class="mode-info">
                        <h3>Classic Unlimited</h3>
                        <p>Endless memory test! Push your limits to get the highest score.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="hidden">
            <div class="status-bar">
                <span class="level-display" id="level-display">Level 1</span>
                <span class="score-hint" id="mode-display">Mode: Level</span>
            </div>

            <div id="sequence-display">
                <p id="sequence-text">Watch the pattern!</p>
            </div>
            
            <div class="color-buttons mode-4" id="color-buttons">
                <!-- Color buttons render dynamically -->
            </div>
            
            <div id="result-message"></div>
            
            <div class="control-btns">
                <button class="action-btn" id="restart-btn" onclick="restartCurrentGame()">Restart</button>
                <button class="action-btn" style="background:rgba(120,120,120,0.3); color:var(--text-main);" onclick="exitToMenu()">Home Menu</button>
            </div>
        </div>

    </div>

    <script>
        const EASY_COLORS = [
            { id: 'red', label: '🔴 Red', freq: 261.63 },
            { id: 'blue', label: '🔵 Blue', freq: 329.63 },
            { id: 'green', label: '🟢 Green', freq: 392.00 },
            { id: 'yellow', label: '🟡 Yellow', freq: 523.25 }
        ];

        const HARD_COLORS = [
            ...EASY_COLORS,
            { id: 'orange', label: '🟠 Orange', freq: 440.00 },
            { id: 'purple', label: '🟣 Purple', freq: 587.33 }
        ];

        const MAX_LEVELS = 25;
        let activeColors = EASY_COLORS;
        let difficulty = 'easy'; // 'easy' or 'hard'

        let audioCtx = null;
        let isMuted = false;
        
        let sequence = [];
        let playerSequence = [];
        let level = 1;
        let gameActive = false;
        let gameMode = 'level';
        let currentMode = 'dark';
        
        const modeScreen = document.getElementById('mode-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultMsg = document.getElementById('result-message');
        const seqText = document.getElementById('sequence-text');
        const levelDisplay = document.getElementById('level-display');
        const modeDisplay = document.getElementById('mode-display');
        const modeToggleBtn = document.getElementById('modeToggleBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const colorButtonsContainer = document.getElementById('color-buttons');

        function changeTheme(themeName) {
            document.body.setAttribute('data-theme', themeName);
        }

        function toggleDarkLightMode() {
            currentMode = currentMode === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-mode', currentMode);
            modeToggleBtn.textContent = currentMode === 'dark' ? '🌙' : '☀️';
        }

        function toggleAudioMute() {
            isMuted = !isMuted;
            soundToggleBtn.textContent = isMuted ? '🔇' : '🔊';
        }

        function setDifficulty(diff) {
            difficulty = diff;
            document.getElementById('diff-easy').classList.toggle('active', diff === 'easy');
            document.getElementById('diff-hard').classList.toggle('active', diff === 'hard');
            activeColors = diff === 'easy' ? EASY_COLORS : HARD_COLORS;
        }

        function renderColorButtons() {
            colorButtonsContainer.innerHTML = '';
            colorButtonsContainer.className = `color-buttons mode-${activeColors.length}`;

            activeColors.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'color-btn';
                btn.dataset.color = c.id;
                btn.id = `btn-${c.id}`;
                btn.innerHTML = c.label;
                btn.addEventListener('click', handleButtonClick);
                colorButtonsContainer.appendChild(btn);
            });
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(frequency, duration = 300, type = 'sine', volume = 0.3) {
            if (isMuted) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration / 1000);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration / 1000);
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

        function playGameOverSound() {
            playSound(150, 600, 'sawtooth', 0.4);
        }

        function playWinSound() {
            playSound(523.25, 200, 'triangle', 0.3);
            setTimeout(() => playSound(659.25, 200, 'triangle', 0.3), 200);
            setTimeout(() => playSound(783.99, 400, 'triangle', 0.3), 400);
        }

        function startGame(mode) {
            initAudio();
            gameMode = mode;
            renderColorButtons();
            
            modeScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            
            const modeText = mode === 'level' ? 'Mode: 25 Levels' : 'Mode: Classic (Unlimited)';
            const diffText = difficulty === 'easy' ? 'Easy' : 'Hard';
            modeDisplay.textContent = `${modeText} (${diffText})`;
            
            restartCurrentGame();
        }

        function exitToMenu() {
            gameActive = false;
            gameScreen.classList.add('hidden');
            modeScreen.classList.remove('hidden');
        }

        function restartCurrentGame() {
            sequence = [];
            playerSequence = [];
            level = 1;
            resultMsg.textContent = '';
            nextRound();
        }
        
        function generateNextColor() {
            const randomColor = activeColors[Math.floor(Math.random() * activeColors.length)].id;
            sequence.push(randomColor);
        }
        
        function playSequence() {
            gameActive = false;
            setButtonsDisabled(true);
            seqText.textContent = 'Watch the pattern...';
            
            let i = 0;
            const interval = setInterval(() => {
                if (i >= sequence.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        seqText.textContent = 'Your turn! Repeat the pattern.';
                        gameActive = true;
                        setButtonsDisabled(false);
                    }, 500);
                    return;
                }
                
                flashButton(sequence[i]);
                i++;
            }, 800);
        }

        function flashButton(colorId) {
            const btn = document.getElementById(`btn-${colorId}`);
            if (!btn) return;
            
            const colorObj = activeColors.find(c => c.id === colorId);
            btn.classList.add('active');
            if (colorObj) {
                playSound(colorObj.freq, 400, 'sine', 0.3);
            }
            
            setTimeout(() => {
                btn.classList.remove('active');
            }, 400);
        }

        function setButtonsDisabled(disabled) {
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.disabled = disabled;
            });
        }
        
        function updateDisplay() {
            if (gameMode === 'level') {
                levelDisplay.textContent = `Level ${level} / ${MAX_LEVELS}`;
            } else {
                levelDisplay.textContent = `Level ${level}`;
            }
        }
        
        function nextRound() {
            playerSequence = [];
            generateNextColor();
            updateDisplay();
            playSequence();
        }

        function handleButtonClick(e) {
            if (!gameActive) return;
            
            const button = e.target.closest('.color-btn');
            if (!button) return;
            
            const selectedColor = button.dataset.color;
            flashButton(selectedColor);
            
            playerSequence.push(selectedColor);
            const currentIndex = playerSequence.length - 1;
            
            if (playerSequence[currentIndex] !== sequence[currentIndex]) {
                markWrong(button);
                return;
            }

            if (playerSequence.length === sequence.length) {
                gameActive = false;
                
                if (gameMode === 'level' && level === MAX_LEVELS) {
                    resultMsg.textContent = '🏆 Congratulations! You Completed All 25 Levels!';
                    seqText.textContent = '🎉 You are a Memory Master!';
                    playWinSound();
                    setButtonsDisabled(true);
                    return;
                }

                level++;
                resultMsg.textContent = '🎉 Level Passed!';
                setTimeout(() => {
                    resultMsg.textContent = '';
                    nextRound();
                }, 1200);
            }
        }
        
        function markWrong(button) {
            gameActive = false;
            button.classList.add('wrong');
            playGameOverSound();
            resultMsg.textContent = '❌ Game Over!';
            seqText.textContent = 'Wrong pattern pressed!';
            setButtonsDisabled(true);
            
            setTimeout(() => {
                button.classList.remove('wrong');
            }, 1200);
        }
    </script>
</body>
</html>
